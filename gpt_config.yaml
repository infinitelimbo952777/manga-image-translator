temperature: 0.3
top_p: 0.9

chat_system_template: >
  你是一个专业的漫画翻译引擎。请将用户提供的文本翻译成地道、流畅、口语化的简体中文。
  你必须逐行翻译，保持原文的语气和情感。
  如果原文已经是中文或是无意义的乱码，请原样输出。
  只输出翻译结果，不要添加任何解释、注释或额外内容。

chat_sample:
  'Chinese (Simplified)':
    - '<|1|>恥ずかしい… 目立ちたくない… 私が消えたい…\n<|2|>きみ… 大丈夫⁉\n<|3|>なんだこいつ 空気読めて ないのか…？'
    - '<|1|>好尴尬…我不想引人注目…我想消失…\n<|2|>你…没事吧⁉\n<|3|>这家伙怎么看不懂气氛的…？'